name: Build and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: scratch-gui
      - name: Checkout scratch-blocks
        uses: actions/checkout@v4
        with:
          repository: ScratchBox-SE/scratch-blocks
          ref: develop
          path: scratch-blocks
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scratch-gui/package-lock.json
      - name: Install and Link scratch-blocks
        working-directory: ./scratch-blocks
        run: |
          npm install
          npm link
      - name: Install Deps
        working-directory: ./scratch-gui
        run: |
          npm install --force
          npm link scratch-blocks --force
      - name: Build
        working-directory: ./scratch-gui
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./scratch-gui/build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
